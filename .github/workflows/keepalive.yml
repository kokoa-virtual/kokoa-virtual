name: keepalive
on:
  schedule: [{cron: '0 12 */3 * *'}]
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar a ping()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -sS --max-time 30 -o body.txt -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/ping" -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}')
          cat body.txt
          echo
          [ "$code" = "200" ]
