name: backup
# Respaldo semanal de la base de Supabase (domingo 03:00 en Bogotá).
# El archivo se CIFRA antes de subirlo: los artefactos de un repositorio público
# pueden descargarlos otras personas, y el respaldo contiene datos personales.
on:
  schedule: [{cron: '0 8 * * 0'}]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17 gnupg

      - name: Volcar la base
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # Quita espacios, saltos de línea y comillas que se cuelan al pegar el secret
          DB_URL="$(printf '%s' "$DB_URL" | tr -d '[:space:]"'"'")"
          case "$DB_URL" in
            postgresql://*|postgres://*) ;;
            *) echo "::error::El secret SUPABASE_DB_URL no es una dirección válida: tiene ${#DB_URL} caracteres y empieza por '${DB_URL:0:6}'. Debe empezar por postgresql://"; exit 1 ;;
          esac
          echo "Conectando a: ${DB_URL##*@}"   # solo servidor, puerto y base; sin usuario ni clave
          PGDUMP=/usr/lib/postgresql/17/bin/pg_dump
          $PGDUMP "$DB_URL" --no-owner --no-privileges --schema=public -Fc -f public.dump
          $PGDUMP "$DB_URL" --no-owner --no-privileges --data-only \
            --table=auth.users --table=auth.identities -Fc -f auth.dump
          # Comprobar que el volcado se puede leer y no está vacío
          test "$(stat -c %s public.dump)" -gt 10000
          /usr/lib/postgresql/17/bin/pg_restore --list public.dump > /dev/null
          /usr/lib/postgresql/17/bin/pg_restore --list auth.dump > /dev/null
          tar czf kokoa-respaldo.tar.gz public.dump auth.dump
          rm public.dump auth.dump

      - name: Cifrar
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$PASS"
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
              --passphrase "$PASS" -o kokoa-respaldo.tar.gz.gpg kokoa-respaldo.tar.gz
          rm kokoa-respaldo.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: kokoa-respaldo-${{ github.run_number }}
          path: kokoa-respaldo.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
